name: Lint & Format

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-format:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - run: corepack enable yarn

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: yarn

      - name: Install dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if yarn --immutable; then
              exit 0
            fi
            if [[ "${attempt}" -eq 4 ]]; then
              echo "yarn install failed after ${attempt} attempts"
              exit 1
            fi
            delay=$((attempt * 20))
            echo "yarn install failed (attempt ${attempt}); retrying in ${delay}s..."
            sleep "${delay}"
          done

      - name: Run check lint and format
        run: yarn check
